on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
    
  pull_request:
    branches:
      - main
      - "realise/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run testes
        run: npm test